# mcp-tools.example.yaml
#
# 这是“带注释的完整示例配置”。
# 如果你只是先在本机跑起来，请优先看：
#   - mcp-tools.minimal.yaml
#
# 默认配置文件位置：
#   - Linux / macOS: ~/.mcp-tools/config.yaml
#   - Windows:       %USERPROFILE%\\.mcp-tools\\config.yaml
#
# 代码内部会用 os.UserHomeDir() + filepath.Join(...) 计算这个路径，
# 因此会自动兼容 Windows 的路径分隔符。
#
# 配置优先级：
#   defaults < 默认 home 配置文件 < YAML < environment variables
#
# YAML 必须是单文档配置；空文件/仅注释文件允许存在并表示“不做 YAML 覆盖”。
# 未知字段、字段拼写错误或额外文档会在启动或 -validate-config 时失败。
#
# 最常用、最需要先理解的只有 3 个：
#   1. bearer_token
#   2. listen_addr
#   3. allowed_roots

# 服务监听地址。
# - 127.0.0.1:8080  -> 仅本机可访问，最安全，推荐本地测试默认用这个
# - 0.0.0.0:8080    -> 所有网卡都监听，适合远程 agent 接入，但风险更高
listen_addr: 127.0.0.1:8080

# Bearer Token。
# 所有客户端都必须带：
#   Authorization: Bearer <token>
bearer_token: change-me

# 控制台日志级别：
# - INFO  : 默认，显示服务启动/停止、成功工具调用、重要运行状态
# - WARN  : 只看警告与错误
# - ERROR : 只看错误
# - DEBUG : 展开 HTTP/MCP 调试细节与更多字段
log_level: INFO

# yolo 分支默认危险模式：
# - 对已授权 MCP 客户端放开文件路径、工作目录、Git 仓库与原始命令执行限制
# - 仍保留 Bearer Token、控制台日志与审计日志
unsafe_allow_all: true

# 额外允许的工作区目录。
# 注意：
# - 服务启动目录会自动加入 allowed roots
# - ~/.mcp-tools 也会自动加入 allowed roots
# - 这里配置的是“额外白名单目录”
# - 列表项不能为空；空字符串会按配置错误拒绝
allowed_roots:
  - ./workspace

# 只用于“浏览器来源 / CORS”控制，不是 hostname 入站控制。
# 只有浏览器/Web UI 这类会带 Origin 头的请求，才会受它影响。
#
# 规则：
# - 不配置 / 留空：
#     * 非浏览器客户端（通常没 Origin 头）可以正常连
#     * 浏览器客户端会被拒绝
# - 正确配置后：
#     * 只有这些 Origin 才允许访问
#
# 例子：
# allowed_origins:
#   - http://localhost:3000
#   - https://your-ui.example
#
# 如果你不是从浏览器页面连服务，通常可以先不配。
# allowed_origins: []

# 审计日志路径。
# 默认值：
#   - Linux / macOS: ~/.mcp-tools/mcp-audit.jsonl
#   - Windows:       %USERPROFILE%\\.mcp-tools\\mcp-audit.jsonl
#
# 一般建议直接用默认值，避免把日志落到仓库目录里。
# 只有你想显式覆盖默认位置时才需要取消注释：
# audit_log_path: /absolute/path/to/mcp-audit.jsonl

# 审计日志滚动：
# - audit_rotate_max_mb <= 0 表示不滚动
# - audit_rotate_max_backups 控制保留多少个旧文件
# - 轮转文件名形如：
#   - mcp-audit.jsonl.1
#   - mcp-audit.jsonl.2
audit_rotate_max_mb: 10
audit_rotate_max_backups: 5

# 单次命令默认超时（秒）
command_timeout_sec: 30

# stdout/stderr 或大文本返回的截断上限（字节）
output_max_bytes: 65536

# 单个 SSE stream 的内部消息队列长度。
# 正常先保持默认值即可。
stream_queue_size: 128

# 单次 HTTP 请求体上限（字节）
max_request_bytes: 1048576

# HTTP server 超时配置（秒）
read_header_timeout_sec: 5
read_timeout_sec: 15
write_timeout_sec: 30
idle_timeout_sec: 60

# MCP session 默认 TTL（分钟）
session_ttl_min: 120

# 服务元信息
server_name: mcp-tools
server_version: 1.0.0

# 协议版本白名单。通常不需要改。
supported_protocols:
  - 2025-11-25
  - 2025-06-18
  - 2025-03-26
  - 2024-11-05

git:
  # Git 只开放固定白名单子命令，不支持任意透传，也不支持 push。
  allowed_subcommands:
    - status
    - diff
    - log
    - add
    - restore
    - commit
    - branch
    - switch
    - pull

exec:
  presets:
    # gofmt -w
    go_fmt:
      enabled: true
      command: gofmt
      fixed_args: ["-w"]
      allowed_args: ["-s", "-l"]
      timeout_sec: 30
      read_only: false

    # go mod download
    go_mod_download:
      enabled: true
      command: go
      fixed_args: ["mod", "download"]
      allowed_args: ["-x", "-json"]
      timeout_sec: 30
      read_only: false

    # go test
    go_test:
      enabled: true
      command: go
      fixed_args: ["test"]
      allowed_args: ["-run", "-count", "-timeout", "-v", "-race", "-cover", "-coverprofile"]
      timeout_sec: 30
      read_only: true

    # go generate
    go_generate:
      enabled: true
      command: go
      fixed_args: ["generate"]
      allowed_args: ["-run", "-skip", "-v", "-x", "-n", "-tags"]
      timeout_sec: 30
      read_only: false

    # go build
    go_build:
      enabled: true
      command: go
      fixed_args: ["build"]
      allowed_args: ["-v", "-race", "-o", "-tags"]
      timeout_sec: 30
      read_only: false

    # go vet
    # 注意：当前明确不支持 -vettool
    go_vet:
      enabled: true
      command: go
      fixed_args: ["vet"]
      allowed_args: ["-tags"]
      timeout_sec: 30
      read_only: true

    # 所有 Go preset 默认都会把 GOCACHE / GOMODCACHE / GOTMPDIR
    # 固定到 ~/.mcp-tools/cache 下，因此依赖下载和构建缓存不会外溢到不可控的系统目录。

    # go mod tidy
    go_mod_tidy:
      enabled: true
      command: go
      fixed_args: ["mod", "tidy"]
      allowed_args: ["-v", "-e", "-diff", "-go", "-compat", "-x"]
      timeout_sec: 30
      read_only: false

    # go get <module@version>
    go_get:
      enabled: true
      command: go
      fixed_args: ["get"]
      allowed_args: ["-t", "-u", "-x", "-tags"]
      timeout_sec: 30
      read_only: false

    # go list
    go_list:
      enabled: true
      command: go
      fixed_args: ["list"]
      allowed_args: ["-deps", "-json", "-test", "-tags"]
      timeout_sec: 30
      read_only: true

    # go work sync
    go_work_sync:
      enabled: true
      command: go
      fixed_args: ["work", "sync"]
      timeout_sec: 30
      read_only: false

  # fixed command templates for exec_run_template
  command_templates:
    make_test:
      enabled: true
      command: ["make", "test"]
      category: test
      destructive: false
      requires_confirmation: false
      allowed_workdirs: ["."]
      timeout_sec: 30
      read_only: false

    make_build:
      enabled: true
      command: ["make", "build"]
      category: build
      destructive: false
      requires_confirmation: false
      allowed_workdirs: ["."]
      timeout_sec: 30
      read_only: false

    go_clean_testcache:
      enabled: true
      command: ["go", "clean", "-testcache"]
      category: cleanup
      destructive: true
      requires_confirmation: true
      env:
        GOFLAGS: ""
      timeout_sec: 30
      read_only: false

# fs_pull_file：把服务器工作区文件拉回客户端。
#
# 客户端调用 fs_pull_file 后会拿到一个带签名的短时效下载 URL，
# 用 GET 访问该 URL 即可把文件下载到客户端本地（URL 是唯一授权凭据）。
# 默认返回相对路径 URL（/file/<token>），客户端用自己的 MCP base URL 拼接；
# 反代/公网部署时配置 url.public_base_url 可让服务端直接返回绝对 URL。
#
# 安全说明：
# - token 内嵌文件路径 + HMAC 签名，不可伪造、不可篡改
# - 服务重启后所有已签发 URL 立即失效（签名密钥不落盘）
# - 下载时服务端会再次校验 allowed roots、扩展名白名单与大小上限
pull_file:
  enabled: true
  # 扩展名白名单。空 = 不限制类型；大小写不敏感，条目必须以 "." 开头。
  # 例：只想允许图片：
  # allowed_extensions:
  #   - .png
  #   - .jpg
  #   - .jpeg
  #   - .bmp
  allowed_extensions: []
  # 单文件大小上限（字节），默认 10 MiB
  max_bytes: 10485760
  url:
    # 下载链接有效期（秒），默认 300（5 分钟）
    ttl_sec: 300
    # 可下载次数：0 = 不限制（仅受 ttl_sec 约束）；>0 = 次数上限
    max_downloads: 0
    # 可选。外部可访问的 base URL（必须 http/https，不能带 query/fragment）。
    # 留空 = 工具返回相对路径 /file/<token>，由客户端按自身 MCP base 拼接。
    # public_base_url: "https://files.example.com/mcp-tools"
