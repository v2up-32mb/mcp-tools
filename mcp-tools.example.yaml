listen_addr: 0.0.0.0:8080
bearer_token: change-me
allowed_roots:
  - ./workspace
allowed_origins:
  - https://your-ui.example
audit_log_path: ./logs/mcp-audit.jsonl
command_timeout_sec: 30
output_max_bytes: 65536
stream_queue_size: 128
max_request_bytes: 1048576
read_header_timeout_sec: 5
read_timeout_sec: 15
write_timeout_sec: 30
idle_timeout_sec: 60
session_ttl_min: 120
server_name: mcp-tools
server_version: 0.1.0
supported_protocols:
  - 2025-11-25
  - 2025-03-26
  - 2024-11-05

git:
  allowed_subcommands:
    - status
    - diff
    - log
    - add
    - restore
    - commit
    - branch
    - switch
    - pull

exec:
  presets:
    go_fmt:
      enabled: true
      command: gofmt
      fixed_args: ["-w"]
      allowed_args: ["-s", "-l"]
      timeout_sec: 30
      read_only: false
    go_test:
      enabled: true
      command: go
      fixed_args: ["test"]
      allowed_args: ["-run", "-count", "-timeout", "-v", "-race", "-cover", "-coverprofile"]
      timeout_sec: 30
      read_only: true
    go_build:
      enabled: true
      command: go
      fixed_args: ["build"]
      allowed_args: ["-v", "-race", "-o", "-tags"]
      timeout_sec: 30
      read_only: false
    go_vet:
      enabled: true
      command: go
      fixed_args: ["vet"]
      allowed_args: ["-tags", "-vettool"]
      timeout_sec: 30
      read_only: true
