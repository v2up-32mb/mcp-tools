# mcp-tools.minimal.yaml
#
# 最小可用配置：适合“先在本机跑起来测试”
#
# 推荐使用方式：
#   1. 复制到 ~/.mcp-tools/config.yaml
#   2. 修改 bearer_token
#   3. 按需追加 allowed_roots / allowed_origins
#
# 默认配置文件位置：
#   - Linux / macOS: ~/.mcp-tools/config.yaml
#   - Windows:       %USERPROFILE%\\.mcp-tools\\config.yaml

listen_addr: 127.0.0.1:8080
bearer_token: change-me

# 控制台日志级别。
# 调试 HTTP/MCP 细节时可临时改成 DEBUG。
log_level: INFO

# yolo 分支默认危险模式。
unsafe_allow_all: true

# 额外允许目录。
# 服务启动目录和 ~/.mcp-tools 会自动加入白名单。
allowed_roots:
  - ./workspace

# 审计日志默认会写到：
#   - Linux / macOS: ~/.mcp-tools/mcp-audit.jsonl
#   - Windows:       %USERPROFILE%\\.mcp-tools\\mcp-audit.jsonl
audit_rotate_max_mb: 10
audit_rotate_max_backups: 5

# 如果你不是浏览器页面接入，这里可以先不配。
# allowed_origins:
#   - http://localhost:3000
